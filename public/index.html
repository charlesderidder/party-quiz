<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welkom bij Party Quiz</title>
  <link rel="stylesheet" href="/css/homey-style.css" />
  <script src="/admin-navigation.js" defer></script>
  <style>
    .welcome-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .welcome-card {
      width: min(100%, 560px);
      padding: clamp(28px, 7vw, 56px);
      text-align: center;
    }

    .welcome-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 22px;
    }

    .welcome-card h1 {
      font-size: clamp(32px, 8vw, 48px);
      line-height: 1.1;
      letter-spacing: -0.035em;
      margin: 18px 0 14px;
    }

    .welcome-card p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .welcome-card .btn-homey {
      justify-content: center;
      width: 100%;
    }
  </style>
</head>
<body>
  <main class="welcome-shell">
    <section class="glass-card welcome-card">
      <div class="welcome-icon" aria-hidden="true">🎉</div>
      <span class="glass-pill">Samen spelen, samen lachen</span>
      <h1>Welkom bij Party Quiz!</h1>
      <p>Klaar om mee te spelen? Kies je naam en doe mee met de quiz.</p>
      <a href="/play" class="btn-homey btn-primary btn-lg">Doe mee aan de quiz →</a>
    </section>
  </main>
</body>
</html>
