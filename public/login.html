<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beheerder aanmelden - Party Quiz</title>
  <link rel="stylesheet" href="/css/homey-style.css" />
</head>
<body>
  <main class="glass-card" style="max-width:420px;margin:10vh auto;padding:32px;">
    <h1>Beheerder aanmelden</h1>
    <p>Spelers kunnen zonder beheerderswachtwoord <a href="/play">deelnemen</a>.</p>
    <form id="loginForm">
      <label for="password">Beheerderswachtwoord</label>
      <input id="password" class="input-homey" type="password" autocomplete="current-password" required />
      <button class="btn-homey btn-primary" type="submit">Aanmelden</button>
    </form>
    <p id="error" role="alert"></p>
    <p>Stel het eerste wachtwoord in via de Homey-appinstellingen, of via de omgevingsvariabele bij zelfstandig gebruik.</p>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error');
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        const next = new URLSearchParams(location.search).get('next');
        location.href = next && /^\/(admin|host|settings)(\/|$|\?)/i.test(next) ? next : '/admin';
      } catch (err) {
        error.textContent = err.message;
      }
    });
  </script>
</body>
</html>
