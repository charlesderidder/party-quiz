<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homey Party Quiz Widget</title>
  <style>
    :root {
      --bg-card: rgba(255, 255, 255, 0.86);
      --bg-row: rgba(241, 245, 249, 0.85);
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --accent-blue: #00A4E8;
      --accent-indigo: #6366F1;
      --accent-green: #10B981;
      --accent-amber: #F59E0B;
      --border-glass: rgba(255, 255, 255, 0.65);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-card: rgba(30, 41, 59, 0.88);
        --bg-row: rgba(15, 23, 42, 0.65);
        --text-primary: #F8FAFC;
        --text-secondary: #94A3B8;
        --border-glass: rgba(255, 255, 255, 0.1);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: transparent;
      color: var(--text-primary);
      padding: 12px;
      user-select: none;
      overflow: hidden;
    }

    .widget-shell {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 22px;
      padding: 14px 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 256px;
      justify-content: space-between;
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: linear-gradient(135deg, #00A4E8, #6366F1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      box-shadow: 0 4px 12px rgba(0, 164, 232, 0.35);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-row);
    }

    .badge-live {
      background: rgba(16, 185, 129, 0.16);
      color: #10B981;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .top3-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-row);
      padding: 7px 11px;
      border-radius: 12px;
      font-size: 12.5px;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .medal {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
    }

    .medal-1 { background: rgba(245, 158, 11, 0.2); color: #D97706; }
    .medal-2 { background: rgba(148, 163, 184, 0.25); color: #64748B; }
    .medal-3 { background: rgba(217, 119, 6, 0.18); color: #B45309; }

    .player-score {
      font-weight: 800;
      color: var(--accent-blue);
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 16px 8px;
      background: var(--bg-row);
      border-radius: 14px;
    }

    .widget-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00A4E8, #0284C7);
      color: white;
      box-shadow: 0 4px 12px rgba(0, 164, 232, 0.28);
    }

    .btn-secondary {
      background: var(--bg-row);
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="widget-shell">
    <div class="widget-header">
      <div class="brand">
        <div class="brand-icon">Q</div>
        <div>
          <div class="brand-title" id="quizTitle">Homey Party Quiz</div>
          <div class="brand-subtitle" id="phaseText">Wachten in lobby...</div>
        </div>
      </div>
      <div class="badges">
        <span class="badge badge-live" id="questionBadge">
          <span class="dot"></span>
          <span id="questionCounter">Lobby</span>
        </span>
        <span class="badge" id="playerCountBadge">👥 0</span>
      </div>
    </div>

    <div class="top3-list" id="top3Container">
      <div class="empty-state">Nog geen spelers verbonden. Scan de QR-code op het hoofdscherm!</div>
    </div>

    <div class="widget-actions" id="controlsBar">
      <button class="btn btn-primary" id="btnNext">⏭️ Volgende stap</button>
      <button class="btn btn-secondary" id="btnOpenHost">📺 Hoofdscherm</button>
    </div>
  </div>

  <script>
    let homeyInstance = null;
    let currentHostUrl = '/host';

    function renderStatus(data) {
      if (!data) return;
      document.getElementById('quizTitle').textContent = data.quizName || 'Homey Party Quiz';
      document.getElementById('playerCountBadge').textContent = `👥 ${data.playerCount || 0}`;

      const phaseLabels = {
        lobby: 'Lobby geopend — scan QR',
        question: `Vraag actief (${data.remainingSeconds ?? 0}s)`,
        reveal: 'Tussenstand & Podium',
        finished: 'Eindstand — Quiz voltooid!'
      };
      document.getElementById('phaseText').textContent = phaseLabels[data.phase] || 'Stand-by';

      if (data.totalQuestions > 0 && data.currentQuestionIndex >= 0) {
        document.getElementById('questionCounter').textContent =
          `Vraag ${data.currentQuestionIndex + 1}/${data.totalQuestions}`;
      } else {
        document.getElementById('questionCounter').textContent =
          data.phase === 'finished' ? 'Klaar' : 'Lobby';
      }

      if (data.hostUrl) {
        currentHostUrl = data.hostUrl;
      }

      const container = document.getElementById('top3Container');
      const top3 = data.top3 || [];
      if (top3.length === 0) {
        container.innerHTML = '<div class="empty-state">Nog geen spelers verbonden. Scan de QR-code op /host!</div>';
      } else {
        container.innerHTML = top3.map((p, idx) => {
          const rank = idx + 1;
          const medals = ['🥇', '🥈', '🥉'];
          const deltaIcon = p.rankDelta > 0 ? '▲' : (p.rankDelta < 0 ? '▼' : '•');
          return `
            <div class="player-row">
              <div class="player-left">
                <span class="medal medal-${rank}">${medals[idx] || rank}</span>
                <span>${escapeHtml(p.avatar || '🎉')} ${escapeHtml(p.name)}</span>
                <span style="font-size:10px;opacity:0.65">${deltaIcon}</span>
              </div>
              <div class="player-score">${p.score} pt</div>
            </div>
          `;
        }).join('');
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    async function fetchStatusFallback() {
      try {
        const res = await fetch('/api/widget/status');
        if (res.ok) {
          const data = await res.json();
          renderStatus(data);
        }
      } catch (err) {
        // Ignore transient network errors
      }
    }

    async function triggerNextStep() {
      if (homeyInstance) {
        try {
          const status = await homeyInstance.api('POST', '/next', {});
          renderStatus(status);
          return;
        } catch (e) {}
      }
      const res = await fetch('/api/widget/next', { method: 'POST' });
      if (res.ok) renderStatus(await res.json());
    }

    document.getElementById('btnNext').addEventListener('click', triggerNextStep);
    document.getElementById('btnOpenHost').addEventListener('click', () => {
      if (homeyInstance && homeyInstance.openURL) {
        homeyInstance.openURL(currentHostUrl);
      } else {
        window.open(currentHostUrl, '_blank');
      }
    });

    // Official Homey SDK v3 Widget callback
    function onHomeyReady(Homey) {
      homeyInstance = Homey;
      const settings = Homey.getSettings();
      if (settings && settings.showControls === false) {
        document.getElementById('controlsBar').style.display = 'none';
      }
      Homey.ready();

      const poll = async () => {
        try {
          const data = await Homey.api('GET', '/');
          renderStatus(data);
        } catch (err) {}
      };
      poll();
      setInterval(poll, 2000);
    }

    // Fallback when previewed directly in browser outside mobile Homey Dashboard
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (!homeyInstance) {
          fetchStatusFallback();
          setInterval(fetchStatusFallback, 1500);
        }
      }, 300);
    });
  </script>
</body>
</html>
